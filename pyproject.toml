[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scenecompose"
version = "0.1.0"
description = "Adaptive scene partitioning and 3D object composition pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "Pillow>=10,<13",
  "imageio>=2.34,<3",
  "OpenEXR>=3,<4",
  "trimesh>=4,<5",
  "plyfile>=1,<2",
]

[project.scripts]
scenecompose = "scenecompose.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scenecompose"]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.pypi-dependencies]
scenecompose = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.12.*"
